<!DOCTYPE html>
<html>
<head>
    <title>Booking</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>
{% extends "base.html" %}


{% block content %}
    <h2>Booking Page</h2>
    <p>Select your movie and show time below:</p>
    
    <form method="post" class="booking-form">
        <div class="form-group">
            <label for="film">Film:</label>
            <select name="film" id="film" required>
                <option value="" disabled selected>Select a film</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="date">Date:</label>
            <input type="date" name="date" id="date" required>
        </div>
        
        <div class="form-group">
            <label for="showtime">Show Time:</label>
            <select name="showtime" id="showtime" required>
                <option value="" disabled selected>Select a time</option>
                <option value="time1">10:00 AM</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="ticketType">Ticket Type:</label>
            <select name="ticketType" id="ticketType">
                <option value="standard">Standard ($10)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="quantity">Number of Tickets:</label>
            <input type="number" name="quantity" id="quantity" min="1" max="10" required>
        </div>
        
        <button type="submit">Continue to Seat Selection</button>
    </form>
{% endblock %}
