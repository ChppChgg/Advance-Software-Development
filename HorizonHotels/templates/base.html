<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Horizon Movies{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <div class="logo">
            <a href="{{ url_for('index') }}">Horizon Movies</a>
        </div>
    </header>
    
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="toggle-sidebar" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search...">
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('index') }}"><i class="fas fa-home"></i> <span>Home</span></a>
                {% if session.username %}
                <a href="{{ url_for('booking') }}"><i class="fas fa-ticket-alt"></i> <span>Book Tickets</span></a>
                <a href="#"><i class="fas fa-film"></i> <span>Booked Movies</span></a>
                <a href="#"><i class="fas fa-list"></i> <span>My List</span></a>
                <a href="#"><i class="fas fa-cog"></i> <span>Settings</span></a>
                <a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
                {% else %}
                <a href="{{ url_for('login') }}"><i class="fas fa-sign-in-alt"></i> <span>Login</span></a>
                {% endif %}
            </nav>
        </div>
        
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            
            const content = document.querySelector('.content');
            content.classList.toggle('expanded');
        }
    </script>
</body>
</html>
